# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - hson

on:
  push:
    branches: [azure]
  workflow_dispatch:

# Giống bản ở trên: set quyền chung ở workflow (job nào cần thì vẫn dùng được)
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          # QUAN TRỌNG: trỏ vào backend (giống bản ở trên)
          pip install -r backend/requirements.txt
      # QUAN TRỌNG: chỉ upload thư mục backend (giống bản ở trên)
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9B24CC88A64C47B1AE5468FE155F85EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C91E179D4F1C40269E5E47A6B20F7141 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9354ACA03E81475EA686FD9A77B30D75 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: hson
          slot-name: Production
          package: backend
