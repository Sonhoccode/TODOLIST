name: Build and deploy Python app to Azure Web App - hson

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- BƯỚC DEBUG QUAN TRỌNG ---
      # Bước này sẽ in ra toàn bộ file trong repo để bạn biết file requirements.txt đang nằm ở đâu
      - name: Check directory structure
        run: ls -R
      # -----------------------------

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          
          # FIX Ở ĐÂY: Trỏ thẳng vào thư mục backend
          if [ -f "backend/requirements.txt" ]; then
            echo "Tim thay file trong folder backend!"
            pip install -r backend/requirements.txt
          elif [ -f "requirements.txt" ]; then
            echo "Tim thay file o thu muc goc!"
            pip install -r requirements.txt
          else
            echo "LOI: Khong tim thay file requirements.txt o dau ca!"
            exit 1
          fi
                
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          # Upload thư mục backend (nơi chứa code Django/Python)
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9EF18412F21C49E989B77AC051B25B6D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4AC3F63DDBD44451AAFE6296784A91DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02996DC3F3A14F76AB0D73A4F6490885 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'hson'
          slot-name: 'Production'
